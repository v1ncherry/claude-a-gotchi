name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build src/claude-a-gotchi -c Release -o build/ci --nologo
      - name: Check costume and language files
        shell: pwsh
        run: |
          # The app is a window program; piping makes PowerShell wait for it and show its output.
          & build/ci/claude-a-gotchi.exe --check . | Out-Host
          if ($LASTEXITCODE -ne 0) { exit 1 }
