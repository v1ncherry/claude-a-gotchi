name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: claude-a-gotchi version
      description: Shown at the bottom of the Settings tab.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The last lines of %LOCALAPPDATA%\claude-a-gotchi\log.txt, if anything looks related.
      render: text
